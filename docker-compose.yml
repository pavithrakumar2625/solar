services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: solarrecover
      POSTGRES_USER: solarrecover
      POSTGRES_PASSWORD: solarrecover
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarrecover -d solarrecover"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://solarrecover:solarrecover@db:5432/solarrecover
      API_CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
